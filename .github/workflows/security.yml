name: Security Gate

# MACH Security & Secrets P1 — three gates:
#   1. Secret scanning  (gitleaks binary — free, no org license needed)
#   2. Dependency / SCA vuln audit  (npm audit --audit-level=high)
#   3. Lockfile-drift enforcement  (npm ci — already fails on drift)
#
# Gate 3 is satisfied by the Install step itself: npm ci exits non-zero if
# package-lock.json is absent or out of sync with package.json.

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly Sunday 02:00 UTC — catches newly-published CVEs between pushes
    - cron: '0 2 * * 0'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Gate 1: Secret scanning ─────────────────────────────────────────────────
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Full history so gitleaks can scan every commit on the ref, not just HEAD
          fetch-depth: 0

      - name: Download gitleaks v8.30.1 binary (pinned, MIT licensed)
        # Using the MIT-licensed gitleaks binary directly avoids the org-license
        # requirement of gitleaks/gitleaks-action@v2 (which errors for org-owned
        # repos that do not have a paid Gitleaks license).
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          ASSET="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ASSET}"
          # DAR-UI-116: the tarball must match the sha256 gitleaks published for this release (checksums.txt).
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -fsSL "${URL}" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks

      - name: Run gitleaks — scan full git history for secrets
        # --source . + fetch-depth:0 means gitleaks detect scans the full commit
        # history on this ref, not just the working tree.
        # --redact: replaces secret values in output with REDACTED so findings are
        # safe to read in public CI logs.
        # --exit-code 1: fails the job if any secret is found (default behaviour).
        # --verbose: prints per-finding details so reviewers can act on them.
        # A .gitleaks.toml allowlist can be added to the repo root to suppress
        # confirmed false-positives; each entry must include an inline comment
        # explaining why it is safe to suppress.
        run: /tmp/gitleaks detect --source . --redact --exit-code 1 --verbose

  # ── Gate 2: SCA / dependency vulnerability audit ────────────────────────────
  sca-audit:
    name: Dependency audit (npm audit, High+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      # Gate 3 is embedded here: npm ci fails if package-lock.json is absent
      # or does not match package.json, enforcing lockfile drift detection.
      - name: "Install (npm ci — Gate 3: lockfile-drift enforcement)"
        run: npm ci

      # --audit-level=high: fails on High or Critical findings only.
      # Low/Moderate findings are reported but do not fail the build to
      # avoid noise from transitive dev-dependency advisories.
      # --omit=dev: scopes to production dependencies only, reducing
      # false-positive noise from dev/test tooling vulnerabilities.
      - name: Audit production dependencies (High/Critical threshold)
        run: npm audit --audit-level=high --omit=dev
